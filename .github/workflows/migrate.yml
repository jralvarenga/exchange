name: Migrate database

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two migrations against the same database at once, and never cancel
# one that has started.
concurrency:
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Drizzle migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds the DATABASE_URL secret. Add required reviewers on this environment
    # in the repository settings to approve each migration by hand.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set the DATABASE_URL secret on the production environment."
            exit 1
          fi
          bun run db:migrate
