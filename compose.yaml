services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: exchange
      POSTGRES_PASSWORD: exchange
      POSTGRES_USER: exchange
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U exchange -d exchange']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27.1
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres_data:
